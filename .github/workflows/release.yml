name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build portable exe
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run package:exe

      - name: Upload unsigned exe
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: packaging/out/TaskManager.exe
          if-no-files-found: error

      # Enable this once SignPath Foundation approves the project:
      #   1. Create a "task-manager" project in SignPath.io.
      #   2. Add SIGNPATH_API_TOKEN as a repository secret.
      #   3. Add SIGNPATH_ORGANIZATION_ID as a repository variable.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: task-manager
          signing-policy-slug: release-signing
          artifact-configuration-slug: task-manager-exe
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Select final exe
        id: final
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          if (Test-Path "signed/TaskManager.exe") {
            Copy-Item "signed/TaskManager.exe" "dist/TaskManager.exe"
            Get-AuthenticodeSignature "dist/TaskManager.exe" | Format-List
          }
          else {
            Copy-Item "packaging/out/TaskManager.exe" "dist/TaskManager.exe"
            Write-Host "Signing is not configured yet; publishing the unsigned build."
          }

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/TaskManager.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  TaskManager.exe" | Set-Content "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/TaskManager.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/TaskManager.exe" `
            "dist/SHA256SUMS.txt" `
            --title "Task Manager ${{ github.ref_name }}" `
            --generate-notes
