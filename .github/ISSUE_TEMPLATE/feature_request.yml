name: Feature request
description: Suggest a view, a column, a shortcut or a workflow the app is missing.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This app stays deliberately small: Windows only, no telemetry, no cloud, no
        database. Requests that fit that shape have the best chance.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "I cannot tell which service restarted" is more useful than "add a restarts column".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the app to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools, Task Manager itself, a PowerShell command.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Processes
        - Performance
        - Services
        - Startup apps
        - Users
        - History / activity log
        - Portable exe / tray
        - Build, docs or tooling
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require sending data off the machine.
          required: true
        - label: This does not require a new runtime dependency (or I explain why it is needed).
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
